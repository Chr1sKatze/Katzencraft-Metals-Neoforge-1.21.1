# This is a neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional.
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

description='''
Example mod description.
'''

# ============================================================
# CORE DEPENDENCIES
# ============================================================

[[dependencies.${mod_id}]]

modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]

modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# ============================================================
# RPG / COMBAT DEPENDENCIES
# ============================================================

[[dependencies.${mod_id}]]

modId="spell_engine"
type="required"
versionRange="[1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]

modId="spell_power"
type="required"
versionRange="[1.0,)"
ordering="NONE"
side="BOTH"

